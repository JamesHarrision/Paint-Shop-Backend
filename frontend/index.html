<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Paint Shop AI | Sáng Tạo Không Gian</title>
    <link rel="stylesheet" href="./style.css">
  </head>
  <body class="selection:bg-terracotta selection:text-white bg-cream text-charcoal">
    <!-- Overlay Grain Texture -->
    <div class="fixed inset-0 pointer-events-none z-[9999] opacity-[0.03]" style="background-image: url('https://www.transparenttextures.com/patterns/stardust.png');"></div>

    <!-- Global Loading Overlay -->
    <div id="global-loader" class="fixed inset-0 z-[10001] bg-cream flex items-center justify-center transition-opacity duration-500">
        <div class="flex flex-col items-center">
            <div class="w-16 h-16 border-8 border-charcoal border-t-terracotta rounded-full animate-spin shadow-retro-sm"></div>
            <p class="mt-6 text-[10px] font-black uppercase tracking-[0.3em] animate-pulse">Initializing Paint Lab...</p>
        </div>
    </div>

    <!-- App Content Wrapper -->
    <main id="app" class="min-h-screen">
      <!-- Loading State -->
      <div class="flex items-center justify-center h-[80vh]">
        <div class="w-12 h-12 border-4 border-charcoal border-t-terracotta animate-spin"></div>
      </div>
    </main>

    <script type="module" src="/main.js"></script>
  </body>
</html>
