version: '3.8'

services:
  # 1. Database (Giữ nguyên)
  db:
    image: mysql:8.0
    container_name: paint_shop_mysql
    restart: always
    env_file:
      - .env
    ports:
      - '${MYSQL_PORT}:3306'
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - app_network
    healthcheck:
      # (Mới) Đảm bảo DB sống trước khi Backend gọi
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      timeout: 20s
      retries: 10

  # 2. Redis (Giữ nguyên)
  redis:
    image: redis:alpine
    container_name: paint_shop_redis
    ports:
      - '${REDIS_PORT}:6379'
    networks:
      - app_network

  # 3. Python Service
  python_service:
    build: ./python-service
    container_name: paint_shop_python
    ports:
      - "${AI_SERVICE_PORT}:8000"
    networks:
      - app_network

  # 4. Backend Node.js (CẬP NHẬT LỚN)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: runner # Chỉ định rõ dùng stage 'runner'
    container_name: paint_shop_backend
    ports:
      - "3000:3000"

    # Quan trọng: BỎ volumes mount code nguồn. 
    # Chỉ giữ lại volume cho file upload để không mất ảnh khi restart container.
    volumes:
      - ./backend/uploads:/app/uploads

    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3000
      # Override networking for Docker Internal Communication
      - DATABASE_URL=mysql://root:${MYSQL_ROOT_PASSWORD}@db:3306/${MYSQL_DATABASE}
      - REDIS_HOST=redis
      - AI_SERVICE_URL=http://python_service:8000

    depends_on:
      db:
        condition: service_healthy # Chờ DB healthcheck ok mới start backend
      redis:
        condition: service_started
      python_service:
        condition: service_started

    networks:
      - app_network
    # KHÔNG dùng 'command: npm run dev' nữa. 
    # Docker sẽ tự dùng CMD ["npm", "start"] trong Dockerfile.

  # 5. Nginx Proxy Manager (Dành cho VPS)
  nginx-proxy-manager:
    image: 'jc21/nginx-proxy-manager:latest'
    container_name: paint_shop_npm
    restart: always
    ports:
      - '80:80'   # HTTP
      - '81:81'   # Admin UI Dashboard
      - '443:443' # HTTPS
    volumes:
      - ./npm_data:/data
      - ./npm_letsencrypt:/etc/letsencrypt
    networks:
      - app_network
    depends_on:
      - backend

networks:
  app_network:
    driver: bridge

volumes:
  mysql_data:
  npm_data:
  npm_letsencrypt:
